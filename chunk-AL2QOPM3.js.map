<ul class="divide-y" [class]="rowClasses()">
  @for (entry of entries; track entry.days) {
    <li class="flex flex-wrap items-center justify-between gap-x-6 gap-y-1.5 py-3.5">
      <span class="text-body font-semibold" [class]="dayClasses()">{{ entry.days }}</span>

      @if (entry.closed) {
        <span [class]="closedBadgeClasses()">Fechado</span>
      } @else {
        <span
          class="flex flex-wrap items-center gap-x-2 gap-y-1 text-body tabular-nums"
          [class]="periodClasses()"
        >
          @for (period of entry.periods; track period) {
            <span class="font-medium">{{ period }}</span>
            @if (!$last) {
              <span class="text-ink-300" aria-hidden="true">|</span>
            }
          }
        </span>
      }
    </li>
  }
</ul>
