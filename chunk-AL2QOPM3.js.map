<img
  [src]="image().src"
  [attr.srcset]="srcset()"
  [attr.sizes]="srcset() ? sizes() : null"
  [alt]="image().alt"
  [width]="image().width"
  [height]="image().height"
  [class]="imgClass()"
  [attr.loading]="priority() ? 'eager' : 'lazy'"
  [attr.fetchpriority]="priority() ? 'high' : 'auto'"
  decoding="async"
/>
