<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Referrer policy.

      The private area's URLs are parameterised by real records —
      `/private/vehicles/AA-00-BB`, `/private/customers/42` — so a full URL in a
      `Referer` header is customer data leaving the site. Every page makes
      cross-origin requests (the webfont, and Analytics on the public side), and
      each one carries that header.

      `strict-origin-when-cross-origin` sends the full URL only to this origin,
      bare `https://fsautomotive.pt` to other origins, and nothing at all when
      leaving https for http. It is also what current browsers already default
      to, so this changes no behaviour today — it pins it, for the browsers that
      do not and for anyone who later assumes the default is `no-referrer-when-
      downgrade`. `no-referrer` would be stricter still and is deliberately not
      used: it would blind the public site's own campaign attribution without
      protecting anything the private area has not already covered.
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!--
      Content Security Policy.

      WHY IT IS A META TAG AND NOT A HEADER
      -------------------------------------
      A header is the better home for this and should be preferred wherever the
      deployment can set one. This site is served as static files from GitHub
      Pages, which cannot, so the policy travels in the document instead. If a
      CDN or reverse proxy is ever put in front, move this to a real header and
      add `frame-ancestors 'none'` — that directive is *ignored* in a meta tag,
      so clickjacking cover has to come from the header or from
      `X-Frame-Options` at the edge. It is deliberately not listed below: a
      directive that cannot work here would only read as protection that exists.

      WHAT EACH NON-OBVIOUS ENTRY IS FOR
      ----------------------------------
      - `script-src` has no `'unsafe-inline'`, and must not gain one: the bundle
        is external, and the only inline block is `application/ld+json`, which
        browsers never execute. This is the directive that actually blunts XSS.
      - The `'sha256-…'` beside it covers exactly one inline event handler, and
        `'unsafe-hashes'` is what lets a hash apply to an attribute at all. The
        Angular build rewrites the webfont <link> into
        `media="print" onload="this.media='all'"` so it loads without blocking
        render — that handler exists only in the built file, never in this one.
        The hash is of the handler body `this.media='all'` and nothing else; it
        cannot authorise any other inline code. If an Angular upgrade changes
        that snippet the hash stops matching and Montserrat silently stays on
        the fallback font, so recompute it then:
          node -e "console.log(require('crypto').createHash('sha256').update(\"this.media='all'\").digest('base64'))"
      - `style-src` does need `'unsafe-inline'`: the Angular build inlines
        critical CSS into two <style> blocks, and components inject their styles
        at runtime. There is no nonce to use without a server rendering the page.
      - `frame-src` is the Google Maps embed on the contact page.
      - `connect-src` lists every origin the app may call: itself, the backend,
        and Analytics. Keep it in step with `API_BASE_URL` — `scripts/ng-env.mjs`
        fails the build when that variable names an origin missing from here,
        because the symptom otherwise is a private area that loads and then
        silently cannot fetch anything.
      - `upgrade-insecure-requests` is deliberately absent: it would rewrite the
        `http://localhost:3000` backend to https and break local development.
        Production is https end to end by configuration, not by this policy.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'self';
               object-src 'none';
               form-action 'self';
               script-src 'self' https://www.googletagmanager.com 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc=';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src 'self' https://fonts.gstatic.com;
               img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com;
               connect-src 'self' https://api.fsautomotive.pt http://localhost:3000 https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com;
               frame-src https://www.google.com;
               manifest-src 'self'"
    />

    <!--
      The company name comes first on the home page, and what the workshop does
      follows it. The name Google prints above the result URL is taken from the
      `WebSite` node below, not from here — this title is read on its own terms.

      Keep this in step with the home route's `meta` in `app.routes.ts`:
      `SeoService` rewrites the title to exactly this string once Angular boots,
      and a crawler that renders the page must not see the name change under it.
      `seo.service.spec.ts` pins the string the route produces.
    -->
    <title>FS Automotive | Oficina Automóvel</title>
    <meta
      name="description"
      content="Oficina automóvel multimarca em Vialonga. Mecânica especializada, diagnóstico computorizado, pintura e carroçaria, pneus e pré-inspeção."
    />
    <meta name="theme-color" content="#0d0e10" />
    <meta name="author" content="FS Automotive" />
    <meta name="robots" content="index, follow" />
    <meta name="format-detection" content="telephone=no" />

    <!--
      Served statically, although `SeoService` sets this tag per route as well.
      This is one of the signals Google reads to name the site above the result
      URL, and the crawler should find it in the HTML as delivered rather than
      only after it has run the bundle.
    -->
    <meta property="og:site_name" content="FS Automotive" />

    <!--
      The site's name, for the line Google prints above the result URL.

      Without it Google has nothing to go on and falls back to the bare domain,
      "fsautomotive.pt". `name` and `url` are the two properties it requires;
      `alternateName` offers the spelling used on the social accounts.

      WHY THIS IS NOT IN `StructuredDataService`
      ------------------------------------------
      The rest of the graph — the workshop, its address, hours and services — is
      published from there, because it is assembled from `SITE` and the data
      files. This node is four constants, and it has to survive being read
      without JavaScript: site names are only ever taken from the home page, so
      there is one chance to present it and no route to re-apply it on.

      The site is a single page application served from this one file, so the
      markup is delivered on every route. That is harmless — Google extracts the
      site name from the home page alone — and it is the price of having it in
      the static HTML at all.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "FS Automotive",
        "alternateName": "FSautomotive",
        "url": "https://fsautomotive.pt/"
      }
    </script>

    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root>
      <!-- Shown until the Angular bundle takes over. -->
      <div style="min-height: 60vh"></div>
    </app-root>
  </body>
</html>
