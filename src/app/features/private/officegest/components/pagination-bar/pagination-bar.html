<nav
  class="flex flex-wrap items-center justify-between gap-4 border-t border-ink-950/8 px-1 pt-4"
  aria-label="Paginação"
>
  <p class="text-meta text-ink-500" aria-live="polite">{{ rangeLabel() }}</p>

  <div class="flex items-center gap-4">
    <label class="flex items-center gap-2 text-meta text-ink-500">
      <span>Por página</span>
      <select
        class="rounded-lg border-0 bg-white py-1.5 pr-8 pl-3 text-meta text-ink-900 ring-1 ring-ink-950/8 ring-inset focus:ring-2 focus:ring-brand-600 focus:outline-none"
        [value]="perPage()"
        [disabled]="disabled()"
        (change)="onPerPage($event)"
      >
        @for (size of pageSizes; track size) {
          <option [value]="size">{{ size }}</option>
        }
      </select>
    </label>

    <div class="flex items-center gap-1">
      <button
        type="button"
        class="inline-flex size-9 items-center justify-center rounded-full text-ink-600 transition-colors hover:bg-ink-100 hover:text-ink-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600 disabled:pointer-events-none disabled:opacity-35"
        [disabled]="previousDisabled()"
        (click)="pageChange.emit(page() - 1)"
      >
        <span class="sr-only">Página anterior</span>
        <app-icon name="chevron-left" [size]="18" />
      </button>

      <span class="min-w-16 text-center text-meta font-semibold text-ink-700"> Página {{ page() }} </span>

      <button
        type="button"
        class="inline-flex size-9 items-center justify-center rounded-full text-ink-600 transition-colors hover:bg-ink-100 hover:text-ink-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600 disabled:pointer-events-none disabled:opacity-35"
        [disabled]="nextDisabled()"
        (click)="pageChange.emit(page() + 1)"
      >
        <span class="sr-only">Página seguinte</span>
        <app-icon name="chevron-right" [size]="18" />
      </button>
    </div>
  </div>
</nav>
