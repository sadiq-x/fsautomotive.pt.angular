<app-page-hero
  eyebrow="Os nossos serviços"
  title="Tudo o que a sua viatura precisa, no mesmo sítio"
  lead="Da revisão de rotina à reparação pós-colisão. Toque num serviço para ver exatamente o que está incluído."
/>

<!-- ========================================================== Catálogo === -->
<app-page-section tone="bone">
  <div class="mx-auto max-w-4xl">
    <div class="rounded-3xl bg-white p-4 shadow-card sm:p-8" appReveal>
      <app-accordion>
        @for (service of services; track service.id) {
          <app-accordion-item
            [itemId]="service.id"
            [title]="service.title"
            [summary]="service.description"
            [icon]="service.icon"
          >
            <ul class="grid gap-2.5 sm:grid-cols-2">
              @for (highlight of service.highlights; track highlight) {
                <li class="flex items-start gap-2.5 text-body text-ink-700">
                  <app-icon
                    name="check"
                    [size]="17"
                    [strokeWidth]="2.5"
                    class="mt-0.5 shrink-0 text-brand-600"
                  />
                  {{ highlight }}
                </li>
              }
            </ul>
          </app-accordion-item>
        }
      </app-accordion>
    </div>

    <p class="mt-8 text-center text-body text-ink-500">
      Não encontrou o que procura?
      <a [href]="site.phone.href" class="font-semibold text-brand-700 underline-offset-4 hover:underline"
        >Ligue-nos</a
      >
      — se for automóvel, provavelmente resolvemos.
    </p>
  </div>
</app-page-section>

<!-- =========================================================== Veículos === -->
<app-page-section tone="white" sectionId="veiculos">
  <app-section-heading
    eyebrow="Multimarca"
    title="Tipos de veículos que recebemos"
    lead="Trabalhamos com ligeiros, comerciais, todo-o-terreno, clássicos e desportivos — todas as marcas, sem exceções."
    appReveal
  />

  <ul class="mt-14 grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5">
    @for (vehicle of vehicles; track vehicle.id) {
      <li appReveal [revealDelay]="$index * 60">
        <app-vehicle-card [vehicle]="vehicle" />
      </li>
    }
  </ul>
</app-page-section>

<!-- ================================================================ CTA === -->
<app-page-section tone="bone" spacing="sm">
  <app-cta-band
    title="Peça o seu orçamento"
    lead="Descreva-nos o problema ou o serviço que procura. Damos-lhe resposta com prazos e valores claros, antes de qualquer intervenção."
  />
</app-page-section>
