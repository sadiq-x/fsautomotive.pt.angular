<ul class="grid gap-4" [class]="columns() === 2 ? 'sm:grid-cols-2' : 'sm:grid-cols-2 lg:grid-cols-3'">
  @for (image of images(); track image.src) {
    <li>
      <button
        type="button"
        (click)="openAt($index)"
        [attr.aria-label]="'Ampliar: ' + image.alt"
        class="group relative block w-full cursor-pointer overflow-hidden rounded-2xl bg-ink-900 shadow-card transition duration-300 hover:-translate-y-1 hover:shadow-card-hover"
      >
        <app-responsive-image
          [image]="image"
          [sizes]="sizes()"
          imgClass="aspect-4/3 w-full object-cover transition duration-500 ease-out group-hover:scale-105"
        />
        <!--
          Hover affordance only. This used to be a permanent scrim carrying a
          caption; with the caption gone it would be a dark band framing
          nothing, so it rests fully clear and the photograph is shown as taken.
          Each image's caption is still read out on the enlarged view.
        -->
        <span
          class="absolute inset-0 bg-linear-to-t from-ink-950/55 via-ink-950/5 to-transparent opacity-0 transition-opacity duration-300 group-hover:opacity-100"
          aria-hidden="true"
        ></span>
        <span
          class="absolute right-3 bottom-3 grid size-9 place-items-center rounded-full bg-white/15 text-white opacity-0 backdrop-blur-sm transition duration-300 group-hover:opacity-100"
          aria-hidden="true"
        >
          <app-icon name="external-link" [size]="16" />
        </span>
      </button>
    </li>
  }
</ul>
