@if (lightbox.isOpen()) {
  <div
    class="fixed inset-0 z-100 flex animate-fade-in items-center justify-center bg-ink-950/92 p-4 backdrop-blur-sm sm:p-8"
    role="dialog"
    aria-modal="true"
    aria-label="Visualizador de imagem"
    (click)="lightbox.close()"
  >
    <button
      type="button"
      (click)="lightbox.close()"
      aria-label="Fechar visualizador"
      class="absolute top-4 right-4 z-10 grid size-11 cursor-pointer place-items-center rounded-full bg-white/10 text-white transition hover:bg-brand-600 sm:top-6 sm:right-6"
    >
      <app-icon name="close" [size]="22" [strokeWidth]="2.25" />
    </button>

    @if (lightbox.total() > 1) {
      <button
        type="button"
        (click)="lightbox.previous(); $event.stopPropagation()"
        aria-label="Imagem anterior"
        class="absolute top-1/2 left-3 z-10 grid size-11 -translate-y-1/2 cursor-pointer place-items-center rounded-full bg-white/10 text-white transition hover:bg-brand-600 sm:left-6"
      >
        <app-icon name="chevron-right" [size]="22" [strokeWidth]="2.25" class="rotate-180" />
      </button>
      <button
        type="button"
        (click)="lightbox.next(); $event.stopPropagation()"
        aria-label="Imagem seguinte"
        class="absolute top-1/2 right-3 z-10 grid size-11 -translate-y-1/2 cursor-pointer place-items-center rounded-full bg-white/10 text-white transition hover:bg-brand-600 sm:right-6"
      >
        <app-icon name="chevron-right" [size]="22" [strokeWidth]="2.25" />
      </button>
    }

    @if (lightbox.current(); as image) {
      <figure class="max-h-full w-full max-w-5xl" (click)="$event.stopPropagation()">
        <app-responsive-image
          [image]="image"
          sizes="(min-width: 64rem) 62vw, 92vw"
          imgClass="mx-auto max-h-[78svh] w-auto rounded-lg object-contain shadow-2xl"
        />
        <figcaption class="mt-4 flex items-center justify-center gap-3 text-sm text-bone-300">
          @if (image.caption) {
            <span>{{ image.caption }}</span>
          }
          @if (lightbox.total() > 1) {
            <span class="text-bone-400 tabular-nums">{{ lightbox.position() }} / {{ lightbox.total() }}</span>
          }
        </figcaption>
      </figure>
    }
  </div>
}
