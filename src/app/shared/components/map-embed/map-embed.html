<div
  class="relative overflow-hidden rounded-2xl bg-bone-200 shadow-card ring-1 ring-ink-950/5"
  [class]="frameClass()"
>
  <iframe
    [src]="embedUrl"
    [title]="title()"
    class="absolute inset-0 h-full w-full border-0"
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade"
    allowfullscreen
  ></iframe>
</div>
