<div class="relative isolate overflow-hidden rounded-3xl bg-ink-950 px-6 py-section-sm sm:px-12">
  <!-- Decorative brand glow: a background layer, so it cannot overflow. -->
  <span class="pointer-events-none absolute inset-0 glow-diagonal" aria-hidden="true"></span>

  <div class="relative flex flex-col items-start gap-10 lg:flex-row lg:items-center lg:justify-between">
    <div class="max-w-2xl">
      <p class="flex items-center gap-2 text-eyebrow text-brand-400 uppercase">
        <span class="h-px w-6 bg-current" aria-hidden="true"></span>
        {{ eyebrow() }}
      </p>
      <h2 class="mt-4 text-h2 font-extrabold text-white">
        {{ title() }}
      </h2>
      <p class="mt-4 text-lead text-bone-300">{{ lead() }}</p>

      <p class="mt-6 flex flex-wrap items-center gap-x-6 gap-y-2 text-meta text-bone-400">
        <span class="inline-flex items-center gap-2">
          <app-icon name="clock" [size]="16" class="text-brand-400" />
          Seg–Sex · 08:30–13:00 e 14:30–18:30
        </span>
        <span class="inline-flex items-center gap-2">
          <app-icon name="map-pin" [size]="16" class="text-brand-400" />
          {{ site.address.city }}
        </span>
      </p>
    </div>

    <div class="flex w-full flex-col gap-3 sm:w-auto sm:flex-row lg:flex-col xl:flex-row">
      <app-button [action]="primary" variant="primary" size="lg" iconPosition="left" />
      <app-button [action]="secondary" variant="ghost" size="lg" iconPosition="left" />
    </div>
  </div>
</div>
